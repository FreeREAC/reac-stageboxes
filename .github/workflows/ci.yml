name: ci

# The suite on every push to main and every pull request, on the two distributions the packages are built
# for: Fedora 44 and Debian trixie (bookworm's libadwaita is older than the 1.4 this application needs).
# `meson test` needs no PipeWire session and no stagebox. The release workflow builds the packages.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fedora:
    name: meson test, Fedora 44
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: fedora:44
    steps:
      # libreac-devel comes from the OpenMixer channel: its header is the one home of the head-amp
      # vocabulary rs-headamp.h reads (#4); nothing of libreac is linked.
      - uses: FreeMixer/.github/.github/actions/add-openmixer@v1
      - name: Install the build dependencies
        run: |
          dnf install -y -q --setopt=install_weak_deps=False \
            git gcc meson ninja-build gettext desktop-file-utils appstream glibc-langpack-ca \
            pipewire-devel gtk4-devel libadwaita-devel libreac-devel
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          set -euo pipefail
          meson setup build
          meson compile -C build
          meson test -C build --print-errorlogs

  debian:
    name: meson test, Debian trixie
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: debian:trixie
    steps:
      - uses: FreeMixer/.github/.github/actions/add-openmixer@v1
      - name: Install the build dependencies
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends git ca-certificates gcc meson ninja-build pkgconf \
            gettext desktop-file-utils appstream locales-all \
            libgtk-4-dev libadwaita-1-dev libpipewire-0.3-dev libspa-0.2-dev libreac-dev
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          set -euo pipefail
          meson setup build
          meson compile -C build
          meson test -C build --print-errorlogs
