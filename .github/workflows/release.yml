name: release

# Packages through the shared release workflows of FreeMixer/.github. A tag v<version> that is the Version of
# packaging/reac-stageboxes.spec builds signed RPMs (Fedora 44, x86_64 and aarch64) and DEBs (Debian trixie,
# amd64 and arm64), publishes them to the FreeMixer channel and attaches them to the GitHub release, whose
# notes are the git log since the previous tag. Any other run, a pull request or a branch, is a dry run: it
# builds and lints everything and publishes nothing.
#
# The packages need reac-pw at run time only, so nothing here waits on another release.

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rpm:
    uses: FreeMixer/.github/.github/workflows/build-rpm.yml@v1
    with:
      package-name: reac-stageboxes
      publish: ${{ github.ref_type == 'tag' }}
      needs-mod-host: false
      channel-deps: false
    secrets: inherit

  deb:
    uses: FreeMixer/.github/.github/workflows/build-deb.yml@v1
    with:
      package-name: reac-stageboxes
      publish: ${{ github.ref_type == 'tag' }}
      dependencies: ''
      requires: ''
      channel-deps: false
      suite-matrix: '["trixie"]'
    secrets: inherit
