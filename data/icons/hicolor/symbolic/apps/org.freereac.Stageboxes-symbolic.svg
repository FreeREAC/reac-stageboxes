<!-- org.freereac.Stageboxes symbolic icon: the chassis and its three input
     holes as real transparency (evenodd), plus a small link mark for the REAC
     segment. Single flat colour — GTK recolours the whole shape from its
     alpha, so only the silhouette matters, not this fill value. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <path fill-rule="evenodd" fill="#2e3436" d="
    M 2.3,4
    H 12.7
    A 1.3,1.3 0 0 1 14,5.3
    V 10.7
    A 1.3,1.3 0 0 1 12.7,12
    H 2.3
    A 1.3,1.3 0 0 1 1,10.7
    V 5.3
    A 1.3,1.3 0 0 1 2.3,4
    Z
    M 4,7.9 m -1.3,0 a 1.3,1.3 0 1,0 2.6,0 a 1.3,1.3 0 1,0 -2.6,0
    M 8,7.9 m -1.3,0 a 1.3,1.3 0 1,0 2.6,0 a 1.3,1.3 0 1,0 -2.6,0
    M 12,7.9 m -1.3,0 a 1.3,1.3 0 1,0 2.6,0 a 1.3,1.3 0 1,0 -2.6,0
  "/>
  <g fill="#2e3436">
    <circle cx="11.2" cy="3" r="0.95"/>
    <circle cx="14.2" cy="1" r="0.95"/>
  </g>
  <path d="M 11.2,3 L 14.2,1" stroke="#2e3436" stroke-width="1.1" stroke-linecap="round"/>
</svg>
