<!-- org.freereac.Stageboxes application icon.
     A stagebox faceplate — three XLR-style inputs on a rounded chassis — on a
     single accent-colour badge, with a small link mark for the REAC segment
     the box rides. Flat, one accent, no gradients: reads the same on a light
     or a dark shell background. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect x="0" y="0" width="128" height="128" rx="26" fill="#1c71d8"/>

  <rect x="20" y="36" width="88" height="60" rx="11" fill="#ffffff"/>

  <g fill="none" stroke="#1c71d8" stroke-width="6">
    <circle cx="42" cy="66" r="12"/>
    <circle cx="64" cy="66" r="12"/>
    <circle cx="86" cy="66" r="12"/>
  </g>
  <g fill="#1c71d8">
    <circle cx="42" cy="66" r="3.4"/>
    <circle cx="64" cy="66" r="3.4"/>
    <circle cx="86" cy="66" r="3.4"/>
  </g>

  <!-- the REAC link mark: two linked nodes, badged bottom-right of the chassis -->
  <g transform="translate(84,84)">
    <circle cx="0" cy="0" r="15" fill="#1c71d8"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M -6 3 L -1 -3 M 1 3 L 6 -3" fill="none" stroke="#ffffff"
          stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="-6" cy="3" r="2.2" fill="#ffffff"/>
    <circle cx="6" cy="-3" r="2.2" fill="#ffffff"/>
  </g>
</svg>
